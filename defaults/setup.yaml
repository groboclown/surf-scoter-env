# The default system setup.
#
# If nothing else defines a value, Surf Scoter falls back on these.
# Because of that, this acts as the definition for all values used by the
# tooling.  However, you can add new entries where you need them.
#
# See docs/system-config-file.md.

ssh:
    programs:
        keygen: ssh-keygen
    runs:
        mk-key: ${keygen} -t ed25519 -N "" -f ${key-file}
        mk-host-key: ${keygen} -t ed25519 -N "" -f {x:host-key-file}
        remove-known-host: ${keygen} -R {x:host} -f ${known-hosts}
        proxy-command: ${docker:exec} exec -i %h socat STDIO TCP:127.0.0.1:{x:port}
    paths:
        home: ~/.ssh
        key-file: ${home}/scoter-dev-container
        config-file: ${home}/config
        known-hosts: ${home}/known_hosts
    values:
        host-prefix: scoter-

docker:
    programs:
        exec: docker
    runs:
        # How scoter-host starts the broker inside the dev container.
        # Note: adding a `-t` (terminal) will corrupt the binary wire protocol.
        broker: ${exec} exec -i {x:container} {x:broker}
        build: ${exec} build -t {x:tag} {x:dir}
        compose-up: ${exec} compose --env-file {x:env-file} -f {x:compose-file} up -d
        compose-service-stats: >
            ${exec} compose --env-file {x:env-file}
            -f {x:compose-file} stats {x:service}
            --no-stream --format json
        compose-down: ${exec} compose --env-file {x:env-file} -f {x:compose-file} down --volumes
        inspect-image: ${exec} image inspect {x:name} --format json
        inspect-container: ${exec} inspect --format json {x:name}
        image-logs: ${exec} logs {x:name}
        kill-container: ${exec} kill {x:container}

# The Python interpreter that runs the sub-command scripts (the distribution's
# `bin/main_*.py`).  To give the scripts installed libraries, point `exec` at a
# virtual environment's interpreter, such as
# `${scoter:distribution-dir}/.venv/bin/python`.
# SECURITY: the interpreter runs on your host with your privileges; never point
# it into a project.
python:
    programs:
        exec: python3
    runs:
        # How the tools run the distribution's scripts: every `runs` entry that
        # starts one uses this, so the flags are in one place.  `-E` ignores the
        # PYTHON* environment variables (a project's `.envrc` could set
        # PYTHONPATH, say), and `-s` ignores your user site-packages.
        script:
            - ${exec}
            - -E
            - -s
        # How scoter starts a sub-command script; scoter adds the universal
        # configuration file, the sub-command name and its arguments after it.
        sub-command:
            - ${script}
            - '{x:script}'

# Where a project's run keeps its files: the workspace (the clone the
# container works in), and the run's settings and resources.
workspace:
    paths:
        # Outside the project, named by its id (`${scoter:project-id}`, the same
        # for the same project directory), so the project's own files, and the
        # container's, stay apart (FILE-9).  For a workspace per branch, add
        # `/${scoter:project-branch}`: the branch the VCS names, made safe as one
        # path part, and not set when there's none.
        workspace-parent-dir: ${scoter:state-dir}/workspaces/${scoter:project-id}
        setup-dir: ${workspace-parent-dir}/setup
        resources-dir: ${workspace-parent-dir}/resources
        workspace-dir: ${workspace-parent-dir}/workspace


# The 'git' VCS tool.
# The scoter tool will reference this by using the project's `vcs` value,
# with a `-vcs` suffix.
# Not all VCS provide these commands.
#
# A VCS section can say how to find the root of a repository, with
# `runs: find-root`: a command that prints the root of the repository holding
# `{x:start}`, or nothing when it isn't in one.  scoter runs every VCS
# section's `find-root`, and the nearest root wins, so a Git submodule, with its
# own `.git` file, is its own repository when you're inside it.
#
# SECURITY: find the root from the repository's files alone.  Don't run the VCS
# itself (`git rev-parse --show-toplevel` reads the repository's configuration,
# which the project controls).  The distribution's two scripts do this, given
# the file or directory that marks a checkout:
#   vcs_root_nearest.py MARKER START: the nearest directory, at or above
#       START, holding MARKER: `.git` (a directory, or a file in a worktree or
#       submodule), `.hg` or `.svn`.
#   vcs_root_outermost.py MARKER START: the highest directory of the unbroken
#       run holding MARKER, for a VCS that keeps a directory in every directory
#       of a checkout (CVS, with `CVS`).
# Both stop below your home directory, and at a file system boundary.
git-vcs:
    programs:
        exec: git
    runs:
        # SECURITY: keep `--no-local`.  Without it, git clones a local path by
        # hard-linking the object files, so the project and the workspace share
        # them.  The container owns those files (through the user namespace
        # mapping), and could rewrite objects in your real repository behind
        # already-reviewed hashes.  See FILE-2 in
        # docs/security/files-attack-vectors.md.
        local-clone: ${exec} clone --no-local --depth 4 ${scoter:vcs-root} {x:workspace-dir}
        fetch-changes-into: ${exec} fetch {x:workspace-dir} {x:branch}
        fetch-changes: ${exec} fetch --all
        show-fetch-changes: ${exec} log -p HEAD..FETCH_HEAD

        # Requires the user to review the changes and does not commit them.
        # But it's potentially dangerous because it makes those workspace
        # files active.
        merge-changes: ${exec} merge {x:branch}

        find-root:
            - ${python:script}
            - ${scoter:distribution-bin-dir}/vcs_root_nearest.py
            - .git
            - '{x:start}'
        # The branch checked out at `{x:root}`, for the review, read from the
        # repository's files (Git isn't run).  Prints nothing when it can't tell.
        current-branch:
            - ${python:script}
            - ${scoter:distribution-bin-dir}/vcs_git_branch.py
            - '{x:root}'
    values:
        ignore-file: .gitignore
    value-lists:
        # The environment variables these commands don't get.  A project can set
        # them as you enter its directory (a `.envrc`, say), and Git's own point
        # it at another repository (`GIT_DIR`), configuration (`GIT_CONFIG_*`)
        # or program (`GIT_SSH_COMMAND`).  Set them in your Git configuration
        # instead; `core.sshCommand` takes the place of `GIT_SSH_COMMAND`.
        # Note, though, that scoter shouldn't be performing remote pulls or
        # pushes, so dropping that value shouldn't cause issues.
        drop-env:
            - GIT_*


# Default for no vcs - stored as simple files.
# TODO create a "file vcs" python script in the install directory to handle these mechanisms.
#      That should help make this safer.  Also, it will make cross platform (e.g. Windows)
#      support easier.  It also leads to allowing an ignore-file.  See ticket #23.
file-vcs:
    programs:
        cp: cp
        diff: diff
        noop: echo
    runs:
        local-clone: ${cp} -R ${scoter:project-dir} ${workspace:workspace-dir}
        fetch-changes: ${noop}
        show-fetch-changes: ${diff} -R ${workspace:workspace-dir} ${scoter:project-dir}
        merge-changes: ${cp} -R ${workspace:workspace-dir} ${scoter:project-dir}
    values:
        ignore-file: ""


# Information for dealing with developer environments.
dev-env:
    paths:
        firewall-router: ${scoter:distribution-dir}/containers/firewall-router
        network-gateway: ${scoter:distribution-dir}/containers/network-gateway

        docker-compose: ${scoter:distribution-dir}/defaults/docker-compose.yaml
    values:
        firewall-router-image: ${dev-env-image-prefix}firewall-router
        network-gateway-image: ${dev-env-image-prefix}network-gateway
        dev-env-image-prefix: local-surf-scoter/

        # Limits for the docker-compose file.
        mem-limit: 8g
        cpus: 4
        pids-limit: 4096
        logging-max-size: 10m

        # For auto-assigned sshd port, start at this number.
        start-sshd-port: 20160

        # The network gateway: the only way out of the dev container (see
        # docs/security/network.md).  It enforces the project's egress rules, as
        # far as it can, and refuses to start with a rule it can't enforce.
        # Its name: your acceptance of a project's egress rules is for this
        # gateway, and a different one asks for a new review.
        network-gateway-name: squid
        # Where the gateway container reads the configuration
        # `network-gateway-write-config` makes (the docker-compose file mounts it
        # there, read-only).
        network-gateway-config-mount: /user-space/egress-hosts.txt
    runs:
        # Given the universal configuration file (`{x:universal}`) and where to
        # write (`{x:output}`), writes the gateway's configuration from the egress
        # rules, and prints JSON saying what it enforces and what it refuses.  It
        # exits with 1, writing nothing, when it refuses any rule.
        network-gateway-write-config:
            - ${python:script}
            - ${scoter:distribution-bin-dir}/gateway_squid.py
            - '{x:universal}'
            - '{x:output}'


# What a review of a project's settings checks (`scoter verify`), and where
# your acceptances are kept.
#
# `host-commands`: the checks on the commands a project asks to run on your
# computer (its host commands).  Every check is here, so none is missed by
# being somewhere else.  Each check has an `action` (refuse, warn or allow), a
# `reason`, and what it matches.  When several checks match a command, the most
# restrictive wins.
#
# Your setup file can add checks of its own.  To relax one of these for some
# commands, add a check with `overrides: [verification:NAME]` naming those
# commands, rather than replacing the check: a replacement won't get what later
# versions of Surf Scoter add to it.  See docs/system-config-file.md.
#
# Note that a project file declares only what's allowed, whereas this declares
# what's blocked or raises warnings.  This format can't capture everything,
# and instead works as a way to declaratively construct best practice rules
# and warning signs.
verification:
    host-commands:
        shells:
            action: refuse
            reason: >-
                A shell runs whatever command it's given, so the container could run
                anything on your computer.
            commands: [sh, bash, dash, zsh, ksh, mksh, csh, tcsh, fish, presh, nu, cmd, powershell, pwsh]
        command-runners:
            action: refuse
            reason: >-
                It runs another command, named in its arguments, so the container
                chooses what really runs.
            commands:
                - env
                - xargs
                - nice
                - nohup
                - timeout
                - stdbuf
                - setsid
                - chroot
                - unshare
                - nsenter
                - script
                - watch
                - parallel
                - strace
                - ltrace
                - gdb
        interpreters:
            action: refuse
            reason: >-
                An interpreter runs the code it's given, so the container could run
                anything on your computer.
            commands:
                - node
                - nodejs
                - deno
                - bun
                - awk
                - gawk
                - mawk
                - nawk
                - Rscript
                - julia
                - osascript
                - cscript
                - wscript
                - mshta
            name-patterns: ['python*', 'pypy*', 'perl*', 'ruby*', 'php*', 'lua*', 'tclsh*', 'wish*']
        privilege:
            action: refuse
            reason: It runs commands as another user, such as root.
            commands: [sudo, doas, su, pkexec, runas, gsudo]
        remote-shells:
            action: refuse
            reason: >-
                It runs commands on another computer, and takes options (such as
                `-o ProxyCommand=...`) that run a command on yours.
            commands: [ssh, scp, sftp, telnet, rsh]
        multi-call:
            action: refuse
            reason: >-
                A multi-call program is many programs in one, chosen by its name or
                its first argument, including shells.
            commands: [busybox, toybox]
        project-config:
            action: warn
            reason: >-
                It reads configuration, scripts or build files from its working
                directory or its arguments, which the container can write, and those
                can run commands on your computer.
            commands:
                - npm
                - npx
                - yarn
                - pnpm
                - make
                - terraform
                - kubectl
                - helm
                - find
                - poetry
                - uv
                - cargo
                - go
                - mvn
                - gradle
                - rake
                - bundle
            name-patterns: ['pip*']
        code-options:
            action: warn
            reason: >-
                Many programs take code to run after options such as these; check
                that this one doesn't, before letting the container fill it in.
            options: [-c, -e, --eval, --exec, --command]
        find-options:
            action: refuse
            reason: These options run a command for each file found.
            commands: [find]
            options: [-exec, -execdir, -ok, -okdir]
        tar-options:
            action: refuse
            reason: These options run a command of the container's choosing.
            commands: [tar]
            options: [--to-command, --use-compress-program, -I, --checkpoint-action, --info-script, -F]
        rsync-options:
            action: refuse
            reason: These options choose the command rsync runs to connect.
            commands: [rsync]
            options: [-e, --rsh, --rsync-path]
        loader-env:
            action: refuse
            reason: >-
                These variables decide what code a program loads, so the container
                could run its own code inside the command.
            env:
                - '*'
                - LD_*
                - LD_PRELOAD
                - LD_LIBRARY_PATH
                - LD_AUDIT
                - DYLD_*
                - DYLD_INSERT_LIBRARIES
                - DYLD_LIBRARY_PATH
                - PATH
                - PYTHON*
                - PYTHONPATH
                - PYTHONSTARTUP
                - PYTHONHOME
                - NODE_OPTIONS
                - NODE_PATH
                - PERL5LIB
                - PERL5OPT
                - PERLLIB
                - RUBYOPT
                - RUBYLIB
                - BASH_ENV
                - ENV
                - JAVA_TOOL_OPTIONS
                - _JAVA_OPTIONS
        config-env:
            action: warn
            reason: >-
                These variables decide which configuration a program reads, which can
                name commands to run (such as an editor, or Git's SSH command).
            env:
                - HOME
                - XDG_*
                - XDG_CONFIG_HOME
                - GIT_*
                - GIT_SSH
                - GIT_SSH_COMMAND
                - GIT_EXEC_PATH
                - GIT_DIR
                - GIT_WORK_TREE
                - GIT_CONFIG_GLOBAL
                - GIT_CONFIG_SYSTEM
                - GIT_CONFIG_COUNT
                - GIT_ASKPASS
                - SSH_ASKPASS
                - EDITOR
                - VISUAL
                - PAGER
                - DOCKER_HOST
                - DOCKER_CONFIG
                - KUBECONFIG
                - AWS_CONFIG_FILE
                - NPM_CONFIG_*
                - NPM_CONFIG_USERCONFIG
        version-manager:
            action: warn
            reason: >-
                Dealing with version commits should stay within the workspace, and
                not call out to the host for performing these actions.  It could cause
                the container to force the workspace to add a new remote repository,
                promote changes in your name to the parent repository, or even run
                arbitrary commands like commit hooks.
            commands: [git, hg, svn, cvs, p4]
        version-manager-shims:
            action: refuse
            reason: >-
                A version manager's shim picks the real program from a file (such as
                `.tool-versions`) in its working directory, which may be the
                workspace.  Name the real program instead.
            paths:
                - ~/.asdf/shims
                - ~/.local/share/mise/shims
                - ~/.pyenv/shims
                - ~/.pyenv/pyenv-win/shims
                - ~/.nodenv/shims
                - ~/.rbenv/shims
                - ~/.goenv/shims
                - ~/.jenv/shims
                - ~/.plenv/shims
                - ~/.volta/bin
                - ~/.proto/shims
        # A project's `docker` command runs the `docker` section's program.
        docker:
            action: warn
            reason: >-
                An allowed `docker` command can start a container that mounts your
                home directory, and so change anything there, the accepted project
                settings included.
            command-map:
                docker: ${docker:exec}

    paths:
        # Where your acceptances of projects' settings are kept.  They decide what
        # each project may do, so this must be an absolute path outside any
        # project, its workspace and its repository.
        store: ~/.config/surf-scoter.d/verified

    path-lists:
        # The `scoter: path-lists: dev-containers-search` directories whose
        # containers are reviewed like a project's own: kept in the `store` with
        # each acceptance, built from that copy, and a change to one asks for a
        # new review.  Others are trusted as part of your installation.  Add
        # `${scoter:distribution-dir}/containers` to review the distribution's too.
        verified-containers: []

    value-lists:
        # Names of files (and, ending in `/`, directories) in a project's container
        # directories that look like secrets.  The review warns about each: a
        # container directory goes into the image, where the container can read it.
        # Patterns use `*`, `?` and `[...]`, matched against each name.
        secret-file-patterns:
            - .env
            - .env.*
            - '*.pem'
            - '*.key'
            - '*.p12'
            - '*.pfx'
            - id_*
            - .netrc
            - .npmrc
            - .pypirc
            - .git-credentials
            - '*.kdbx'
            - '*.tfstate'
            - .aws/
            - .ssh/
            - .docker/
            - .kube/
        # Hosts anyone can upload to: an egress rule that reaches one lets the
        # container send data out, whatever the other rules say.  The review warns
        # about each.  `*.` covers a domain's subdomains.
        egress-data-out-hosts:
            # Code hosts.
            - github.com
            - '*.github.com'
            - '*.githubusercontent.com'
            - gitlab.com
            - '*.gitlab.com'
            - bitbucket.org
            - codeberg.org
            # Paste sites.
            - pastebin.com
            - paste.ee
            - hastebin.com
            - dpaste.org
            - rentry.co
            # Object storage.
            - s3.amazonaws.com
            - '*.s3.amazonaws.com'
            - '*.blob.core.windows.net'
            - storage.googleapis.com
            - '*.r2.cloudflarestorage.com'
            - '*.digitaloceanspaces.com'
            # Tunnels and user content.
            - '*.ngrok.io'
            - '*.ngrok-free.app'
            - '*.trycloudflare.com'
            - '*.workers.dev'
            - '*.pages.dev'
            - '*.vercel.app'
            - '*.netlify.app'
            - '*.herokuapp.com'
            # Webhooks and chat.
            - webhook.site
            - '*.requestbin.com'
            - '*.pipedream.net'
            - hooks.slack.com
            - discord.com
            - '*.discord.com'
            - api.telegram.org
            # File sharing.
            - transfer.sh
            - file.io
            - wetransfer.com
            - '*.dropbox.com'
            - drive.google.com
        # Domains a project's egress rule can't allow every subdomain of
        # (`*.github.io`, say): public suffixes and shared hosting, where anyone
        # can have a name.  A wildcard on a single label (`*.com`) is always
        # refused.  Add to it in your setup with a copy plus your own entries.
        egress-refused-wildcards:
            # Public suffixes with more than one label.
            - co.uk
            - org.uk
            - ac.uk
            - gov.uk
            - me.uk
            - com.au
            - net.au
            - org.au
            - co.nz
            - co.jp
            - ne.jp
            - or.jp
            - co.kr
            - com.br
            - com.cn
            - com.hk
            - com.mx
            - com.sg
            - com.tr
            - com.tw
            - co.in
            - co.za
            - eu.org
            # Shared hosting and storage: names anyone can get.
            - github.io
            - githubusercontent.com
            - gitlab.io
            - pages.dev
            - workers.dev
            - netlify.app
            - vercel.app
            - herokuapp.com
            - web.app
            - firebaseapp.com
            - appspot.com
            - azurewebsites.net
            - blob.core.windows.net
            - cloudfront.net
            - amazonaws.com
            - s3.amazonaws.com
            - storage.googleapis.com
            - r2.dev
            - blogspot.com
            - glitch.me
            - repl.co
            - ngrok.io
            - ngrok-free.app
            - trycloudflare.com
            - duckdns.org

    values:
        # How long an acceptance of a project's settings lasts, in days.
        expiry-days: 30
        # How many expired acceptances to keep for each project when you ask
        # for a cleanup.  Nothing removes them on its own: the newest is what
        # the next review compares with.
        keep: 10
        # The largest project file, and the most for all of a project's files,
        # kept in the `store` with each acceptance, in bytes.
        max-file-size: 16777216
        max-snapshot-size: 268435456


# The tools' own settings.  The configuration loader adds the locations it
# works out (the `paths` below the comment), which you can't set.
scoter:
    #paths:
    # Set by you or by scoter (--distribution-dir wins):
    #    distribution-dir: set to the Surf Scoter installation directory.
    #
    # Set by scoter, because the tool needs these to find the configuration files.  Allowing you to change
    # these after they've loaded would be a lie.
    #    project-config: set to the project configuration file: `project-file-name` in the
    #        project directory's `project-files-dir`.
    #    project-dir: set to the project directory, which holds the `project-files-dir`.
    #        scoter finds it, searching up from where it runs (or --project-dir) to the root
    #        of the repository holding it.
    #    vcs-root: set to the root of the repository holding the project (see the VCS sections).
    #    dev-container-path: set to the project's dev container directory.
    #    user-setup-file: set to the user's scoter configuration file.
    #    user-dir: set to the user's scoter configuration directory.
    #    cwd: set to the directory the tool ran in.
    #    distribution-bin-dir: set to the distribution's `bin` directory.
    paths:
        # Where the tools keep their own state, such as the running environments.
        # Like `verification: paths: store`, an absolute path outside any project.
        state-dir: ~/.config/surf-scoter.d/state
        # The running environments, so that parallel runs can tell what's in use,
        # and `scoter kill` can stop one; and the lock on changing them.
        running-envs: ${state-dir}/running-env.json
        running-envs-lock: ${state-dir}/running-env.json.lock

    path-lists:
        # Where `dev-container: NAME` looks for NAME/Dockerfile and NAME/dev-env.yaml.
        # SECURITY: a dev container, and every parent it builds on, must be inside
        # the project's `project-files-dir` or one of these directories.  Don't add
        # directories a project controls, such as `${scoter:project-dir}` itself:
        # they would let a project build from, and read, files outside its
        # `project-files-dir`.
        dev-containers-search:
            - ${scoter:project-dir}/${scoter:project-files-dir}
            - ${scoter:distribution-dir}/containers

    runs:
        # The distribution's own commands, which there's no reason to change.
        #
        # Finding your acceptance of a project's settings, in `verification:
        # paths: store`.
        # Given the universal configuration file (`{x:universal}`) with the
        # project, prints JSON saying which acceptance matches, if any.
        find-acceptance:
            - ${python:script}
            - ${scoter:distribution-bin-dir}/verified_find.py
            - '{x:universal}'

    values:
        # The directory, inside the project directory, that holds the project file and the
        # project's dev containers.  Everything the tools read from a project lives there.
        # It must be a single directory name.
        project-files-dir: .surf-scoter.d
        # The project file, in the `project-files-dir`.  It must be a single file name.
        project-file-name: project.yaml
        backup-file-extension: .backup
