# This relies on a generated .env file to fill in the parameters.
# It's hard-coded to work with the default firewall and gateway
# containers.

services:
  firewall:
    image: ${FIREWALL_ROUTER}
    container_name: ${FIREWALL_ROUTER_NAME}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16    # only 'sleep' runs
    mem_limit: 32m
    networks:
      isolated:
        aliases: [gateway]
      uplink: {}
    healthcheck:
      test: ["CMD", "sh", "-c", "nft list table inet egress >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  gateway:
    # Its configuration comes from the project's egress rules, made by the setup's
    # `network-gateway: runs: write-config`.
    image: ${NETWORK_GATEWAY}
    container_name: ${NETWORK_GATEWAY_NAME}
    network_mode: "service:firewall"
    depends_on:
      firewall:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m     # squid with caching off
    logging:
      options:
        max-size: 10m   # the access log goes to stdout
    restart: unless-stopped
    # The long form, so no value can add mount options.
    volumes:
      - type: bind
        source: ${GATEWAY_CONFIG_HOST}
        target: ${GATEWAY_CONFIG_CONTAINER}
        read_only: true

  dev:
    # The local developer places their Dockerfile in this directory.
    # It should have the `containers/dev-env/Dockerfile` built image
    # as its parent.
    image: ${DEV_ENV}
    # Set by `scoter run`: the name you connect to with `ssh`, and that the
    # host connects to with `docker exec`.
    container_name: ${CONTAINER_NAME}
    networks: [isolated]

    # Rootless podman maps the host user to container root by default, so bind
    # mounts show up as owned by root.  keep-id maps the host user to the
    # container's rootless user (1000) instead.
    # This is a generalization, where most containers map the rootless user
    # to uid 1000.
    # The 'keep-id' is Podman-only.  Remove it if you're using Docker.
    userns_mode: "keep-id:uid=1000,gid=1000"

    environment:
      # Because this performs variable substitution on the names, this needs list mode.
      - HTTP_PROXY=http://gateway:3128
      - HTTPS_PROXY=http://gateway:3128
      - http_proxy=http://gateway:3128
      - https_proxy=http://gateway:3128
      - "NO_PROXY="
      - "no_proxy="
      - "${SSHD_PORT_ENV}=${SSHD_PORT}"
      # Where the mounts are, for the container's start-up script.
      - "SCOTER_PROJECT_CLONE=${PROJECT_CLONE_CONTAINER}"
      - "SCOTER_PERSISTENT_STORE=${PERSISTENT_STORE_CONTAINER}"
    depends_on:
      - gateway
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: ${PIDS_LIMIT}     # stops fork bombs
    mem_limit: ${MEM_LIMIT}       # mem + cpu limit: set to taste.
    cpus: ${CPUS}
    memswap_limit: ${MEM_LIMIT}   # same as mem_limit, so no extra swap on top of it.
    logging:
      options:
        max-size: ${LOGGING_MAX_SIZE}  # container logs otherwise grow without bound.
    # The long form, so no value can add mount options.  The persistent
    # store is a volume, not a host directory: host commands can't reach it.
    volumes:
      - type: bind
        source: ${PROJECT_CLONE_HOST}
        target: ${PROJECT_CLONE_CONTAINER}
      - type: bind
        source: ${SETTINGS_HOST}
        target: ${SETTINGS_CONTAINER}
        read_only: true
      - type: volume
        source: persistent-store
        target: ${PERSISTENT_STORE_CONTAINER}
    # Should also put some file size limits on things like tmpfs.
volumes:
  # Made by `scoter run` (`docker: runs: create-volume`) and kept between
  # runs: `external`, so `compose down --volumes` leaves it, and named in
  # full, so compose doesn't prefix it with its project name, which is the
  # same for every environment.
  persistent-store:
    external: true
    name: ${PERSISTENT_STORE_VOLUME}
networks:
  isolated:
    # Docker assigns the subnet per environment; the firewall finds it at startup.
    internal: true
  uplink:
    driver: bridge
