# Surf Scoter's additions to the Envoy gateway, for filling in secrets:
#
# * `filter`: an Envoy HTTP filter (proxy-wasm, built for
#   `wasm32-unknown-unknown`).  On the inject listener it takes the secrets,
#   once; on each read host's listener it fills `{{seekrit:NAME}}` into
#   request headers, and scrubs the values out of the response.
# * `inject`: `envoy-inject`, which `scoter` runs with `docker exec -i` to
#   pass the secrets on its standard input to the inject listener's socket.
#
# This isn't bundled in the root `rust` directory, because these files live
# self-contained just for the Envoy proxy.  They have no library shared with
# the rest of the Rust code.
[workspace]
resolver = "2"
members = ["filter", "inject"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
