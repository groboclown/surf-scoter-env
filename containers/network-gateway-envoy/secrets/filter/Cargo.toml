[package]
name = "secrets-filter"
version = "0.9.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
# cdylib: the Wasm module Envoy loads; rlib: so the logic's tests run on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

# The proxy-wasm glue exists only in the Wasm build; its host calls don't
# link anywhere else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
proxy-wasm = "=0.2.5"
