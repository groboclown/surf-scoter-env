visible_hostname egress-gateway
http_port 3128
# Runs in the foreground as the unprivileged `proxy` user (see the Dockerfile),
# which can't write to /run; no PID file is needed.
pid_filename none
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pinger_enable off

# Exit promptly on SIGTERM; the container runtime sends SIGKILL after 10s.
shutdown_lifetime 1 seconds

acl CONNECT method CONNECT
acl SSL_ports port 443

# The allowed hosts: one regular expression per line, made by Surf Scoter
# from the egress rules (`^host$`, or `^.+\.domain$` for `*.domain`), and
# mounted read-only.  '-n' prohibits reverse lookups; '-i' ignores case.
acl allowed_domains dstdom_regex -n -i "/user-space/egress-hosts.txt"

acl blocked_destinations dst  "/etc/squid/blocked-destinations.txt"

# Only allow CONNECT requests to approved hostnames on TCP 443.
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !allowed_domains

# Block destinations *after* the above list.  Without this, it can leak DNS
# requests to an attacker-controlled DNS server: checking an address list
# means resolving the requested name first.
http_access deny blocked_destinations

http_access allow allowed_domains
http_access deny all
