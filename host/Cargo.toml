[package]
name = "scoter-host"
version = "1.0.0"
edition = "2024"

[lib]
name = "scoter_host"
path = "src/lib.rs"

[[bin]]
name = "scoter-host"
path = "src/main.rs"

[[bin]]
name = "gen-scoter-uc"
path = "src/bin/gen-scoter-uc.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
# The communication library shared with the container's client and broker.
surf-scoter-env-launcher = { path = "../containers/dev-env" }
