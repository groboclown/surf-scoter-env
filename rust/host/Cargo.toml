# The host-side programs: `scoter-host`, the host-execution broker, and
# `gen-scoter-uc`, the universal configuration file generator, with the
# configuration library they share.

[workspace]
resolver = "3"
members = ["config", "scoter-host", "gen-scoter-uc"]

[workspace.package]
version = "0.9.0"
edition = "2024"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The project id (`scoter:project-id`): the same SHA-256 the verified store
# names a project's directory by.
sha2 = "0.11"
yaml_serde = "0.10"
scoter-config = { path = "config" }
# The communication library shared with the container's client and broker.
scoter-comm = { path = "../container/comm" }
